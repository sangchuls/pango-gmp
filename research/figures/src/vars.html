<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Noto Sans CJK KR',sans-serif;background:#fff;color:#111}
.wrap{width:1100px;padding:18px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:12px}
.box{border:2px solid #334155;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.55}
.box h4{margin:0 0 6px;font-size:15px;background:#334155;color:#fff;border-radius:4px;padding:3px 8px;text-align:center}
.iv{width:300px}.dv{width:300px}.mid{flex:1;text-align:center;font-size:26px;color:#334155}
.ctl{border:2px dashed #64748b;border-radius:8px;padding:8px 14px;font-size:13.5px;margin:0 auto 10px;width:900px;text-align:center;background:#f8fafc}
.tag{display:block;border:1px solid #94a3b8;border-radius:4px;padding:2px 7px;margin:3px 0;background:#fff;font-size:13.5px}
.note{font-size:12.5px;color:#475569;text-align:center;margin-top:8px}
</style></head><body><div class="wrap">
<div class="ctl"><b>통제 조건</b>: IT 부하 · 수전용량 · 이중화 수준 · 냉각 방식 · 제공 도면·기준 &nbsp;|&nbsp; <b>조사 변수</b>: 참가자 선행 지식·도구 사용 경험</div>
<div class="row">
<div class="box iv"><h4>독립변수: 검토 방식</h4><span class="tag">A  수작업 · 자료 검색</span><span class="tag">B  LLM + 앱 연동 (온톨로지 없음)</span><span class="tag">C  LLM + 앱 + 온톨로지</span></div>
<div class="mid">⟶</div>
<div class="box dv"><h4>종속변수: 검토 성과</h4><span class="tag">검토 항목 식별률 · 검토 정확도</span><span class="tag">영향 관계 추적성 · 근거 설명가능성</span><span class="tag">소요 시간 · 사용성</span></div>
</div>
<div class="note">매개변수는 두지 않고, 시나리오(전력 확대, 이중화 변경, 랙 밀도 변경)는 과제 조건으로 통제한다. 반복측정 설계로 한 참가자가 세 조건을 모두 수행한다.</div>
</div></body></html>
